services:
  hermes-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-agent
    hostname: hermes-agent
    read_only: true
    tmpfs:
      - /tmp:exec,size=256M
      - /home/hermes/.pi/agent:exec,size=512M
    volumes:
      - ${CAREER_OPS_REPO:-./career-ops}:/workspace:ro
      - hermes-output:/workspace/output
    environment:
      # ADR-012 §8.2: run-hermes.ps1 sets these from the active-agent
      # certificate (scripts/agent-state-helpers.ps1's
      # Resolve-AirlockCertificateValidity), not an independent port probe
      # - the 12345 fallback only applies to a standalone `docker compose`
      # invocation that bypasses run-hermes.ps1 entirely.
      - OLLAMA_HOST=host.docker.internal:${AIRLOCK_OLLAMA_PORT:-12345}
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=http://host.docker.internal:${AIRLOCK_OPENAI_PORT:-12345}/v1
      # Model/profile the certificate proved capable - entrypoint.sh uses
      # these instead of the container's own hardcoded default.
      - AIRLOCK_MODEL=${AIRLOCK_MODEL:-devstral-small-2:24b}
      - AIRLOCK_PROFILE_ID=${AIRLOCK_PROFILE_ID:-}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hermes-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 4g
    cpu_shares: 512
    stdin_open: true
    tty: true

volumes:
  hermes-output:
    driver: local

networks:
  hermes-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"