<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>System Design 3D Visualizer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: -apple-system, "Segoe UI", sans-serif; }
  #canvas-host { position: fixed; inset: 0; }
  #canvas-host canvas { display: block; }

  #ui { position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  #ui .panel { background: rgba(20,22,26,0.88); border: 1px solid #2a2e35; border-radius: 8px; padding: 10px 12px; color: #d8dbe0; font-size: 13px; }
  #ui .panel h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #8b93a1; }
  #ui button { display: block; width: 100%; margin-bottom: 6px; padding: 7px 10px; background: #1c2128; border: 1px solid #333a44; color: #e6e9ee; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left; }
  #ui button:hover { background: #262c35; }
  #ui button.playing { border-color: #4fd18b; color: #4fd18b; }
  #ui button:disabled { opacity: .45; cursor: not-allowed; }
  #ui label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aab1bd; cursor: pointer; }

  #errors { position: fixed; top: 14px; right: 14px; z-index: 10; max-width: 380px; }
  #errors .panel { background: rgba(58,20,20,0.92); border: 1px solid #7a2f2f; border-radius: 8px; padding: 10px 12px; color: #ffd7d7; font-size: 12.5px; }
  #errors .panel h3 { margin: 0 0 6px; font-size: 12px; color: #ff9b9b; }
  #errors ul { margin: 0; padding-left: 18px; }
  #errors li { margin-bottom: 4px; }
</style>
</head>
<body>
  <div id="canvas-host"></div>

  <div id="ui">
    <div class="panel">
      <h3>Workflows</h3>
      <div id="flow-buttons"></div>
      <label><input type="checkbox" id="labels-toggle" checked /> Show labels</label>
    </div>
  </div>

  <div id="errors" style="display:none">
    <div class="panel">
      <h3>Scene validation errors</h3>
      <ul id="error-list"></ul>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ======================================================================
   SAMPLE SCENE DATA — exactly the schema the user specified:
   nodes:  { id, label, pos: [x,y,z], type? }
   edges:  { from, to, label?, style? }
   flows:  { name, path: [nodeId, ...], loop?, speed? }

   This is a small illustrative graph (11 nodes). The renderer below makes
   no assumption about node count — the same code path handles 50+ nodes,
   see the "Show labels" toggle and DECLUTTER_THRESHOLD note in D) below.
   ====================================================================== */
const SCENE_DATA = {
  nodes: [
    { id: "client",      label: "Client",           pos: [-8, 0, 0],  type: "external" },
    { id: "gateway",     label: "API Gateway",       pos: [-4, 0, 0],  type: "service" },
    { id: "auth",        label: "Auth Service",      pos: [-4, 3, -3], type: "service" },
    { id: "orders",      label: "Orders Service",    pos: [0, 0, 0],   type: "service" },
    { id: "inventory",   label: "Inventory Service", pos: [0, 3, -3],  type: "service" },
    { id: "payments",    label: "Payments Service",  pos: [4, 0, 0],   type: "service" },
    { id: "ledger_db",   label: "Ledger DB",         pos: [4, -3, -3], type: "datastore" },
    { id: "orders_db",   label: "Orders DB",         pos: [0, -3, -3], type: "datastore" },
    { id: "queue",       label: "Event Queue",       pos: [0, 0, 4],   type: "infra" },
    { id: "notifier",    label: "Notification Svc",  pos: [4, 3, 4],   type: "service" },
    { id: "webhook",     label: "Partner Webhook",   pos: [8, 3, 4],   type: "external" }
  ],
  edges: [
    { from: "client",    to: "gateway",   label: "HTTPS" },
    { from: "gateway",   to: "auth",      label: "verify token" },
    { from: "auth",      to: "gateway",   label: "token ok" },
    { from: "gateway",   to: "orders",    label: "create order" },
    { from: "orders",    to: "inventory", label: "reserve stock" },
    { from: "inventory", to: "orders",    label: "reserved" },
    { from: "orders",    to: "orders_db", label: "write" },
    { from: "orders",    to: "payments",  label: "charge" },
    { from: "payments",  to: "ledger_db", label: "write" },
    { from: "orders",    to: "queue",     label: "OrderCreated" },
    { from: "queue",     to: "notifier",  label: "consume" },
    { from: "notifier",  to: "webhook",   label: "POST" }
  ],
  flows: [
    {
      name: "Place order (happy path)",
      path: ["client", "gateway", "auth", "gateway", "orders", "inventory", "orders", "payments", "ledger_db"],
      loop: true,
      speed: 3
    },
    {
      name: "Order confirmation event",
      path: ["orders", "queue", "notifier", "webhook"],
      loop: true,
      speed: 2.5
    },
    {
      name: "BROKEN — missing edge (demonstrates error handling, see E)",
      path: ["client", "payments"],
      loop: false,
      speed: 3
    }
  ]
};

/* ======================================================================
   E) VALIDATION — fail loudly, never invent missing graph structure.
   A flow that references a missing node, or steps between two nodes with
   no matching directed edge, is rejected: it will not appear as playable,
   and the exact missing id/edge is reported. Other valid flows still work.
   ====================================================================== */
function validateScene(data) {
  const nodeIds = new Set(data.nodes.map(n => n.id));
  const edgeKey = (a, b) => `${a}->${b}`;
  const edgeSet = new Set(data.edges.map(e => edgeKey(e.from, e.to)));
  const errors = [];

  for (const e of data.edges) {
    if (!nodeIds.has(e.from)) errors.push({ scope: "edge", message: `Edge references missing node "${e.from}"` });
    if (!nodeIds.has(e.to))   errors.push({ scope: "edge", message: `Edge references missing node "${e.to}"` });
  }

  const flowErrors = new Map(); // flow.name -> [messages]
  for (const flow of data.flows) {
    const msgs = [];
    for (const id of flow.path) {
      if (!nodeIds.has(id)) msgs.push(`references missing node "${id}"`);
    }
    for (let i = 0; i < flow.path.length - 1; i++) {
      const a = flow.path[i], b = flow.path[i + 1];
      if (nodeIds.has(a) && nodeIds.has(b) && !edgeSet.has(edgeKey(a, b))) {
        msgs.push(`no edge "${a}" → "${b}" (step ${i + 1})`);
      }
    }
    if (msgs.length) flowErrors.set(flow.name, msgs);
  }

  return { errors, flowErrors };
}

/* ======================================================================
   SCENE SETUP
   ====================================================================== */
const host = document.getElementById("canvas-host");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.Fog(0x0b0d10, 20, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10, 9, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const DEFAULT_CAMERA_POS = camera.position.clone();
const DEFAULT_CAMERA_TARGET = controls.target.clone();

/* ======================================================================
   IMAGE-BASED LIGHTING — a procedural "room" environment (PMREMGenerator
   over RoomEnvironment, no HDRI file to fetch) so physical materials get
   real reflections/highlights instead of the flat matte look a plain
   directional+ambient rig gives. This is the single biggest lever for
   "looks like a Three.js example" vs. "looks like colored boxes."
   ====================================================================== */
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmremGenerator.dispose();

const hemi = new THREE.HemisphereLight(0x8fa8c9, 0x0b0d10, 0.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(8, 14, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 50;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 14;
key.shadow.camera.bottom = -14;
key.shadow.bias = -0.0015;
key.shadow.radius = 3;
scene.add(key);

const grid = new THREE.GridHelper(40, 40, 0x2a2e35, 0x1a1d22);
grid.position.y = -5;
scene.add(grid);

// Real shadow-catcher: a large dim plane at the same height as the grid.
// Subsumes the old per-node fake contact-shadow decals — one physically
// correct shadow system instead of two competing ones.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -5 + 0.001;
ground.receiveShadow = true;
scene.add(ground);

/* ======================================================================
   SELECTIVE BLOOM — only the flow packet and the currently-hovered edge
   glow. Standard two-pass technique: render the scene with every
   non-bloom object swapped to flat black, bloom that pass, then composite
   it additively over a normal full-color render. Objects opt in by
   enabling BLOOM_LAYER on their .layers (the camera itself stays on the
   default layer 0 only, so it never needs to "see" layer 1 directly —
   the darken/restore pass handles visibility instead).
   ====================================================================== */
const BLOOM_LAYER = 1;
const bloomLayer = new THREE.Layers();
bloomLayer.set(BLOOM_LAYER);
const darkMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
const materialCache = new Map();
const visibilityCache = new Map();

function darkenNonBloomed(obj) {
  if (bloomLayer.test(obj.layers)) return;
  if (obj.isMesh) {
    materialCache.set(obj.uuid, obj.material);
    obj.material = darkMaterial;
  } else if (obj.isSprite) {
    // Sprites (the canvas-text node labels) use a dedicated billboard
    // shader keyed off SpriteMaterial — swapping in a Mesh material would
    // mismatch uniforms, so hide instead of darkening. Without this they'd
    // keep their real bright texture through the bloom-only pass and glow
    // as a false halo above every node. Cache the PRE-existing visibility
    // (not assume true) so this doesn't fight the "Show labels" toggle.
    visibilityCache.set(obj.uuid, obj.visible);
    obj.visible = false;
  }
}
function restoreMaterial(obj) {
  if (materialCache.has(obj.uuid)) {
    obj.material = materialCache.get(obj.uuid);
    materialCache.delete(obj.uuid);
  }
  if (visibilityCache.has(obj.uuid)) {
    obj.visible = visibilityCache.get(obj.uuid);
    visibilityCache.delete(obj.uuid);
  }
}

const renderPass = new RenderPass(scene, camera);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.4, 0.15);
const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass);
bloomComposer.addPass(bloomPass);

const mixPass = new ShaderPass(
  new THREE.ShaderMaterial({
    uniforms: {
      baseTexture: { value: null },
      bloomTexture: { value: bloomComposer.renderTarget2.texture }
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(baseTexture, vUv) + vec4(1.0) * texture2D(bloomTexture, vUv);
      }
    `,
    defines: {}
  }),
  "baseTexture"
);
mixPass.needsSwap = true;

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(mixPass);
finalComposer.addPass(new OutputPass());

const TYPE_COLOR = {
  service: 0x4f8fd1,
  datastore: 0xd1a84f,
  infra: 0x8f5fd1,
  external: 0x5fd18b,
  default: 0x8b93a1
};
const NODE_SIZE = 1.0; // half-extent used for edge-surface offset in D)

/* ======================================================================
   NODE + EDGE BUILDING (registry keeps mesh/sprite refs keyed by id)
   ====================================================================== */
const registry = { nodes: new Map(), edges: new Map(), edgeMeshes: [] };

function makeLabelSprite(text) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const fontSize = 48;
  ctx.font = `600 ${fontSize}px -apple-system, sans-serif`;
  const width = Math.ceil(ctx.measureText(text).width) + 40;
  canvas.width = width;
  canvas.height = fontSize + 24;
  ctx.font = `600 ${fontSize}px -apple-system, sans-serif`;
  ctx.fillStyle = "rgba(12,14,17,0.75)";
  ctx.roundRect ? ctx.roundRect(0, 0, canvas.width, canvas.height, 10) : ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fill();
  ctx.fillStyle = "#e8ecf1";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 20, canvas.height / 2 + 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true }));
  const scale = 0.004; // world-units per canvas pixel — keeps a ~16-char label roughly 1.8 units wide, proportionate to a 1-unit node box at the default camera distance
  sprite.scale.set(canvas.width * scale, canvas.height * scale, 1);
  return sprite;
}

function buildNodes(data) {
  for (const n of data.nodes) {
    const color = TYPE_COLOR[n.type] || TYPE_COLOR.default;
    const geo = new RoundedBoxGeometry(NODE_SIZE, NODE_SIZE, NODE_SIZE, 4, 0.12);
    const mat = new THREE.MeshPhysicalMaterial({
      color,
      roughness: 0.4,
      metalness: 0.4,
      clearcoat: 0.35,
      clearcoatRoughness: 0.3,
      envMapIntensity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...n.pos);
    mesh.userData = { nodeId: n.id };
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const label = makeLabelSprite(n.label);
    label.position.set(n.pos[0], n.pos[1] + NODE_SIZE, n.pos[2]);
    scene.add(label);

    registry.nodes.set(n.id, { data: n, mesh, label });
  }
}

/* ======================================================================
   D) EDGE GEOMETRY — a thin cylinder between two node surfaces (not
   centers: we shrink each end by NODE_SIZE/2 along the direction vector
   so the edge visibly starts/ends at the box face) plus a cone arrowhead
   near the target to show communication direction.
   ====================================================================== */
const UP = new THREE.Vector3(0, 1, 0);

function buildEdges(data) {
  for (const e of data.edges) {
    const from = registry.nodes.get(e.from);
    const to = registry.nodes.get(e.to);
    if (!from || !to) continue; // reported by validateScene(); skip drawing broken refs

    const start = from.mesh.position.clone();
    const end = to.mesh.position.clone();
    const dir = end.clone().sub(start);
    const full = dir.length();
    dir.normalize();
    const a = start.clone().addScaledVector(dir, NODE_SIZE * 0.7);
    const b = end.clone().addScaledVector(dir, -NODE_SIZE * 0.9);
    const len = a.distanceTo(b);
    // CylinderGeometry/ConeGeometry both default to their axis along +Y,
    // centered at the origin — aligning UP to `dir` via quaternion is the
    // standard, unambiguous way to point primitive geometry from a to b
    // (avoids the sign/axis pitfalls of combining lookAt() with a
    // pre-rotated geometry).
    const quat = new THREE.Quaternion().setFromUnitVectors(UP, dir);

    const geo = new THREE.CylinderGeometry(0.03, 0.03, len, 8);
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0x4a5058,
      emissive: 0x000000,
      roughness: 0.4,
      metalness: 0.7,
      envMapIntensity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(a).addScaledVector(dir, len / 2); // midpoint of a→b
    mesh.quaternion.copy(quat);
    scene.add(mesh);

    const arrowHeight = 0.22;
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.09, arrowHeight, 8), mat.clone());
    arrow.position.copy(b).addScaledVector(dir, -arrowHeight / 2); // apex lands at b
    arrow.quaternion.copy(quat);
    scene.add(arrow);

    const key = `${e.from}->${e.to}`;
    const entry = { data: e, mesh, arrow, start: a, end: b, length: full };
    registry.edges.set(key, entry);
    registry.edgeMeshes.push(mesh, arrow);
  }
}

buildNodes(SCENE_DATA);
buildEdges(SCENE_DATA);

/* ======================================================================
   D) EDGE PULSING / HOVER HIGHLIGHT — raycast against edge cylinders;
   the hovered edge's material emissive pulses via a sine wave driven by
   the render clock, everything else stays at rest color.
   ====================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let hoveredEdgeKey = null;

renderer.domElement.addEventListener("pointermove", (ev) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNdc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNdc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(registry.edgeMeshes, false);
  hoveredEdgeKey = null;
  for (const [key, entry] of registry.edges) {
    const isHit = hits.length && (hits[0].object === entry.mesh || hits[0].object === entry.arrow);
    entry.mesh.material.emissive.setHex(0x000000);
    entry.arrow.material.emissive.setHex(0x000000);
    entry.mesh.layers.disable(BLOOM_LAYER);
    entry.arrow.layers.disable(BLOOM_LAYER);
    if (isHit) {
      hoveredEdgeKey = key;
      entry.mesh.layers.enable(BLOOM_LAYER);
      entry.arrow.layers.enable(BLOOM_LAYER);
    }
  }
});

/* ======================================================================
   D) FLOW ANIMATION — a glowing dot advances along a flow's path
   segment-by-segment. Progress is tracked as total distance travelled
   (flow.speed in world-units/sec) so the dot moves at constant visual
   speed across segments of different length, rather than one segment
   per fixed time slice.
   ====================================================================== */
class FlowAnimator {
  constructor(flow, edgeRegistry) {
    this.flow = flow;
    this.segments = [];
    for (let i = 0; i < flow.path.length - 1; i++) {
      const key = `${flow.path[i]}->${flow.path[i + 1]}`;
      const edge = edgeRegistry.get(key);
      if (!edge) throw new Error(`FlowAnimator: missing edge "${key}" for flow "${flow.name}"`);
      this.segments.push(edge);
    }
    this.totalLength = this.segments.reduce((sum, s) => sum + s.start.distanceTo(s.end), 0);
    this.distance = 0;
    this.playing = false;

    const geo = new THREE.SphereGeometry(0.12, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffe27a, emissive: 0xffb020, emissiveIntensity: 1.4 });
    this.dot = new THREE.Mesh(geo, mat);
    this.dot.visible = false;
    this.dot.layers.enable(BLOOM_LAYER); // glows via the selective-bloom pass
    scene.add(this.dot);
  }

  start() {
    this.distance = 0;
    this.playing = true;
    this.dot.visible = true;
  }

  stop() {
    this.playing = false;
    this.dot.visible = false;
  }

  update(dt) {
    if (!this.playing) return;
    this.distance += (this.flow.speed || 2) * dt;

    if (this.distance >= this.totalLength) {
      if (this.flow.loop) {
        this.distance %= this.totalLength;
      } else {
        this.stop();
        return;
      }
    }

    let remaining = this.distance;
    for (const seg of this.segments) {
      const segLen = seg.start.distanceTo(seg.end);
      if (remaining <= segLen || seg === this.segments[this.segments.length - 1]) {
        const t = segLen === 0 ? 0 : Math.min(remaining / segLen, 1);
        this.dot.position.lerpVectors(seg.start, seg.end, t);
        this._activeSegment = seg;
        break;
      }
      remaining -= segLen;
    }
  }
}

/* ======================================================================
   CAMERA FLY-TO-FIT — when a workflow starts, ease the camera to frame
   just that flow's nodes; ease back to the default view on stop. Plain
   exponential-decay lerp toward a goal each frame, no tween dependency.
   ====================================================================== */
const camGoalPos = DEFAULT_CAMERA_POS.clone();
const camGoalTarget = DEFAULT_CAMERA_TARGET.clone();
const viewDir = DEFAULT_CAMERA_POS.clone().sub(DEFAULT_CAMERA_TARGET).normalize();

function flyToFlow(flow) {
  const ids = [...new Set(flow.path)];
  const box = new THREE.Box3();
  for (const id of ids) {
    const n = registry.nodes.get(id);
    if (n) box.expandByPoint(n.mesh.position);
  }
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 3);
  const fitDistance = radius / Math.sin((camera.fov * Math.PI) / 360) + 2;
  camGoalTarget.copy(center);
  camGoalPos.copy(center).addScaledVector(viewDir, fitDistance);
}

function flyToDefault() {
  camGoalPos.copy(DEFAULT_CAMERA_POS);
  camGoalTarget.copy(DEFAULT_CAMERA_TARGET);
}

/* ======================================================================
   VALIDATION RESULTS -> UI (error panel + per-flow Play buttons)
   ====================================================================== */
const { errors: edgeErrors, flowErrors } = validateScene(SCENE_DATA);
const errorPanel = document.getElementById("errors");
const errorList = document.getElementById("error-list");
const allErrors = [
  ...edgeErrors.map(e => e.message),
  ...[...flowErrors.entries()].flatMap(([name, msgs]) => msgs.map(m => `"${name}": ${m}`))
];
if (allErrors.length) {
  errorPanel.style.display = "block";
  for (const msg of allErrors) {
    const li = document.createElement("li");
    li.textContent = msg;
    errorList.appendChild(li);
  }
}

const animators = new Map();
const flowButtonsHost = document.getElementById("flow-buttons");
for (const flow of SCENE_DATA.flows) {
  const btn = document.createElement("button");
  const broken = flowErrors.has(flow.name);
  btn.textContent = broken ? `⚠ ${flow.name}` : `▶ ${flow.name}`;
  btn.disabled = broken;
  flowButtonsHost.appendChild(btn);

  if (!broken) {
    const animator = new FlowAnimator(flow, registry.edges);
    animators.set(flow.name, animator);
    btn.addEventListener("click", () => {
      if (animator.playing) {
        animator.stop();
        btn.classList.remove("playing");
        btn.textContent = `▶ ${flow.name}`;
        flyToDefault();
      } else {
        animator.start();
        btn.classList.add("playing");
        btn.textContent = `⏸ ${flow.name}`;
        flyToFlow(flow);
        scheduleIdleAutoRotate();
      }
    });
  }
}

document.getElementById("labels-toggle").addEventListener("change", (ev) => {
  for (const { label } of registry.nodes.values()) label.visible = ev.target.checked;
});

/* ======================================================================
   IDLE AUTO-ROTATE — a slow orbit kicks in after a few seconds of no
   interaction and no flow playing, so the scene reads as "alive" the way
   Three.js's own example gallery demos do. Any drag, or starting a flow,
   cancels it; it re-arms once things go quiet again.
   ====================================================================== */
controls.autoRotateSpeed = 0.6;
let idleTimer = null;
function scheduleIdleAutoRotate() {
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const anyPlaying = [...animators.values()].some(a => a.playing);
    if (!anyPlaying) controls.autoRotate = true;
  }, 3000);
}
controls.addEventListener("start", scheduleIdleAutoRotate);
scheduleIdleAutoRotate();

/* ======================================================================
   RENDER LOOP
   ====================================================================== */
const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  for (const animator of animators.values()) animator.update(dt);

  if (hoveredEdgeKey) {
    const entry = registry.edges.get(hoveredEdgeKey);
    const pulse = 0.6 + Math.sin(t * 6) * 0.4;
    entry.mesh.material.emissive.setRGB(0.9 * pulse, 0.65 * pulse, 0.1 * pulse);
    entry.arrow.material.emissive.setRGB(0.9 * pulse, 0.65 * pulse, 0.1 * pulse);
  }

  const ease = 1 - Math.pow(0.0001, Math.min(dt, 0.1));
  camera.position.lerp(camGoalPos, ease);
  controls.target.lerp(camGoalTarget, ease);
  controls.update();

  scene.traverse(darkenNonBloomed);
  bloomComposer.render();
  scene.traverse(restoreMaterial);
  finalComposer.render();

  requestAnimationFrame(tick);
}
tick();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  bloomComposer.setSize(window.innerWidth, window.innerHeight);
  finalComposer.setSize(window.innerWidth, window.innerHeight);
});
</script>
